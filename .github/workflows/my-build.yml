name: My Build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Compile .so directly
      run: |
        # Ищем все файлы Android.mk и собираем их
        find . -name "Android.mk" -execdir $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=Android.mk NDK_APPLICATION_MK=Application.mk APP_ABI=arm64-v8a \;
    - name: Upload .so
      uses: actions/upload-artifact@v4
      with:
        name: libMenu
        path: "**/*.so"
