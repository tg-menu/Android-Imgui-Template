name: Build Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
    - name: Build with CMake
      run: |
        CMAKE_FILE=$(find . -name "CMakeLists.txt" | head -n 1)
        echo "Найден CMakeLists.txt по пути: $CMAKE_FILE"
        CMAKE_DIR=$(dirname "$CMAKE_FILE")
        mkdir -p build
        cd build
        cmake -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-21 "$GITHUB_WORKSPACE/$CMAKE_DIR"
        make
    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libImGui
        path: build/**/*.so
