name: Build Fix
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Android SDK
      run: |
        export ANDROID_SDK_ROOT=$HOME/android-sdk
        export ANDROID_HOME=$HOME/android-sdk
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null 2>&1 || true

    - name: Setup NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c

    - name: Build with ndk-build
      run: |
        ANDROID_MK=$(find . -name "Android.mk" | head -n 1)
        if [ -z "$ANDROID_MK" ]; then
          echo "Ошибка: Android.mk не найден!"
          exit 1
        fi
        APP_DIR=$(dirname "$ANDROID_MK")
        cd "$APP_DIR"
        cd ..
        $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=./Android.mk NDK_APPLICATION_MK=./Application.mk APP_ABI=arm64-v8a

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: libImGui
        path: libs/arm64-v8a/*.so
